name: League Data Sync

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run manifest or upload"
        required: false
        default: "sync"
        type: choice
        options:
          - "sync"
          - "dry_run"
      full_scan:
        description: "Run a full historical scan from league start date"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      window_start:
        description: "Optional start date for a bounded backfill window, YYYY-MM-DD"
        required: false
        default: ""
        type: string
      window_end:
        description: "Optional end date for a bounded backfill window, YYYY-MM-DD"
        required: false
        default: ""
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: .r-sync-lib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libicu-dev \
            libpq-dev

      - name: Write .Renviron
        run: |
          cat > .Renviron <<'EOF'
          TEAM_CODE=LEAGUE
          PITCH_DATA_BACKEND=postgres
          PITCH_DATA_DB_URL=${{ secrets.PITCH_DATA_DB_URL }}
          PITCH_DATA_SYNC_AFTER_FTP=1
          PITCH_DATA_SYNC_WORKERS=1
          PITCH_DATA_FORCE_RESYNC=0
          TM_SYNC_START_YEAR=2026
          TM_SYNC_LOOKBACK_DAYS=2
          TM_SYNC_INITIAL_FULL=0
          TM_SYNC_DRY_RUN=${{ github.event.inputs.mode == 'dry_run' && '1' || '0' }}
          TM_SYNC_WINDOW_START=${{ github.event.inputs.window_start }}
          TM_SYNC_WINDOW_END=${{ github.event.inputs.window_end }}
          TM_SYNC_MIN_FILENAME_YEAR=2026
          TM_SYNC_LEAGUE_FULL_SCAN=${{ github.event.inputs.full_scan == 'true' && '1' || '0' }}
          EOF
          sed -i 's/^[[:space:]]*//' .Renviron

      - name: Ensure sync library path
        run: mkdir -p .r-sync-lib

      - name: Cache sync R library
        uses: actions/cache@v4
        with:
          path: .r-sync-lib
          key: ${{ runner.os }}-r-league-sync-v1
          restore-keys: |
            ${{ runner.os }}-r-league-sync-

      - name: Install sync R packages
        env:
          R_LIBS_USER: .r-sync-lib
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org/")); pkgs <- c("curl", "readr", "dplyr", "lubridate", "stringr", "glue", "rlang", "tibble", "DBI", "RPostgres", "digest"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) install.packages(missing) else message("All sync packages already installed")'

      - name: Sync LEAGUE data
        env:
          R_LIBS_USER: .r-sync-lib
          TM_SYNC_LEAGUE_FULL_SCAN: ${{ github.event.inputs.full_scan == 'true' && '1' || '0' }}
          TM_SYNC_DRY_RUN: ${{ github.event.inputs.mode == 'dry_run' && '1' || '0' }}
          TM_SYNC_WINDOW_START: ${{ github.event.inputs.window_start }}
          TM_SYNC_WINDOW_END: ${{ github.event.inputs.window_end }}
        run: Rscript --vanilla automated_data_sync.R

      - name: Upload dry-run manifest
        if: ${{ github.event.inputs.mode == 'dry_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: league-sync-manifest
          path: data/league_sync_manifest_*.csv
          if-no-files-found: warn

      - name: Setup Node.js
        if: ${{ github.event.inputs.mode != 'dry_run' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        if: ${{ github.event.inputs.mode != 'dry_run' }}
        run: npm install --no-save pg dotenv

      - name: Backfill level from CSV files
        if: ${{ github.event.inputs.mode != 'dry_run' }}
        env:
          DATABASE_URL: ${{ secrets.PITCH_DATA_DB_URL }}
        run: node scripts/backfill-league-level-from-csv.mjs --data-dir=./data/v3
